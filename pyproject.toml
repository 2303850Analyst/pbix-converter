[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbix-doc"
version = "0.2.0"
description = "Local PBIX to TXT documentation generator"
requires-python = ">=3.11"
dependencies = ["pbixray==0.15.4"]

[project.scripts]
pbix-doc = "pbix_doc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
