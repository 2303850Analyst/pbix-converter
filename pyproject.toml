[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbix-doc"
version = "0.5.0"
description = "Local PBIX to DOCX documentation generator"
requires-python = ">=3.11"
dependencies = ["pbixray==0.15.4", "python-docx==1.2.0"]

[project.scripts]
pbix-doc = "pbix_doc.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
